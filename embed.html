<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <style>
    :root {
      --embed-height: 100vh;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
    }

    iframe {
      width: 100%;
      height: var(--embed-height);
      min-height: 560px;
      flex: 1 1 auto;
      border: 0;
      display: block;
    }

    @media (max-width: 720px) {
      iframe {
        min-height: 100vh;
        min-height: var(--embed-height);
      }
    }
  </style>
</head>
<body>
  <iframe
    src="https://qa-notion-chat.onrender.com"
    allow="clipboard-write"
  ></iframe>
  <script>
    function applyEmbedHeight() {
      var height = window.innerHeight || document.documentElement.clientHeight || 0;
      if (height > 0) {
        document.documentElement.style.setProperty("--embed-height", height + "px");
      }
    }

    window.addEventListener("resize", applyEmbedHeight);
    window.addEventListener("orientationchange", applyEmbedHeight);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", applyEmbedHeight);
    }
    applyEmbedHeight();
  </script>
</body>
</html>
