<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Hyo.Chat</title>
  <link rel="stylesheet" href="https://qa-notion-chat.onrender.com/static/styles.css?v=static-embed-1" />
</head>
<body>
  <section class="chat-widget" aria-label="QA Chatbot">
    <header class="chat-header">
      <img
        class="hanq-avatar header-avatar"
        src="https://qa-notion-chat.onrender.com/static/hanq.png"
        alt="Hyo.Chat"
      />
      <div class="chat-title">
        <p class="eyebrow">IT Quality Management</p>
        <strong>Hyo.Chat</strong>
        <small>노션 QA 페이지와 하위 페이지를 기준으로 답변합니다.</small>
        <span id="syncStatus">준비 중</span>
      </div>
      <div class="header-actions">
        <button id="btnSync" type="button">동기화</button>
      </div>
    </header>
    <main id="messages" class="messages"></main>
    <footer class="composer">
      <textarea id="question" rows="1" placeholder="질문을 입력하세요."></textarea>
      <button id="btnSend" type="button">전송</button>
    </footer>
  </section>

  <script>
    window.HYO_CHAT_API_BASE = "https://qa-notion-chat.onrender.com";
    window.HYO_CHAT_ASSET_BASE = "https://qa-notion-chat.onrender.com";
  </script>
  <script src="https://qa-notion-chat.onrender.com/static/chat.js?v=static-embed-1"></script>
</body>
</html>
