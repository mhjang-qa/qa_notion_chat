services:
  - type: web
    name: qa-notion-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AUTH_REQUIRED
        value: "false"
      - key: USE_GEMINI
        value: "false"
      - key: STARTUP_SYNC_PRIORITY
        value: "true"
      - key: STARTUP_SYNC_MAX_INDEX_AGE_HOURS
        value: "12"
      - key: SLACK_CHANNEL_NAME
        value: "slice_gh-test"
      - key: SLACK_NOTIFY_ENABLED
        value: "true"
      - key: NOTION_TOKEN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
